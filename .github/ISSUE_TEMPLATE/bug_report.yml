name: Bug report
description: Report a reproducible rCodexManager problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not include auth files, OAuth challenges, device codes, tokens, private hosts, session bodies, or complete private paths.
  - type: input
    id: version
    attributes:
      label: rCodexManager version
      placeholder: 0.1.5
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Runtime surface
      options: [macOS desktop, Windows desktop, Linux headless CLI, Mac managing Linux]
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: Apple Silicon, Intel, x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted Doctor output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed authentication material, private hosts, session bodies, and personal paths.
          required: true
