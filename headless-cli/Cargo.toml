[package]
name = "rcodexmanager-headless"
version = "0.1.5"
description = "Headless Linux CLI node for rCodexManager"
authors = ["r-series-lab contributors"]
edition = "2021"

[[bin]]
name = "rcodexmanager"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"

[dev-dependencies]
tempfile = "3.23.0"
